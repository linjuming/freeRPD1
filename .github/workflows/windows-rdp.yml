name: Windows RDP Server

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Core RDP Settings
        shell: pwsh
        run: .github/workflows/scripts/win-configure-rdp.ps1

      - name: Create RDP User with Secure Password
        shell: pwsh
        run: .github/workflows/scripts/win-create-user.ps1

      # - name: Install Apps (Chrome, Sogou Pinyin)
      #   shell: pwsh
      #   run: .github/workflows/scripts/win-install-apps.ps1

      # - name: Install Chinese Language Pack
      #   shell: pwsh
      #   run: .github/workflows/scripts/win-install-chinese-lang.ps1

      - name: Install Tailscale
        shell: pwsh
        run: .github/workflows/scripts/win-install-tailscale.ps1

      - name: Establish Tailscale Connection
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: .github/workflows/scripts/win-establish-ts.ps1

      - name: Verify RDP Accessibility
        shell: pwsh
        run: .github/workflows/scripts/win-verify-rdp.ps1

      - name: Install Custom Software
        shell: pwsh
        run: .github/workflows/scripts/win-install-custom-app.ps1

      - name: Disable RDP Session Timeout
        shell: pwsh
        run: |
          Write-Host "Disabling RDP session timeout policies..."

          $regPath = "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"
          if (-not (Test-Path $regPath)) {
            New-Item -Path $regPath -Force | Out-Null
          }

          Set-ItemProperty -Path $regPath -Name "MaxDisconnectionTime" -Value 0 -Type DWord -Force
          Set-ItemProperty -Path $regPath -Name "MaxConnectionTime"    -Value 0 -Type DWord -Force
          Set-ItemProperty -Path $regPath -Name "MaxIdleTime"          -Value 0 -Type DWord -Force
          Set-ItemProperty -Path $regPath -Name "fResetBroken"         -Value 0 -Type DWord -Force
          Set-ItemProperty -Path $regPath -Name "fInheritResetBroken"  -Value 0 -Type DWord -Force

          Write-Host "Registry timeout policies disabled."

          # 配置服务自启
          & sc.exe config TermService start= auto | Out-Null

          # 只在服务未运行时才启动
          $svc = Get-Service -Name TermService -ErrorAction SilentlyContinue
          if ($svc.Status -ne 'Running') {
            Start-Service -Name TermService -ErrorAction SilentlyContinue
            Write-Host "TermService started."
          } else {
            Write-Host "TermService is already running. Skipping start."
          }

          Write-Host "RDP session timeout disabled successfully."

      - name: Create Logout.bat (Graceful RDP Disconnect)
        shell: pwsh
        run: |
          # 等待用户Profile目录创建完成
          $maxWait = 30
          $waited = 0
          while (-not (Test-Path "C:\Users\vum") -and $waited -lt $maxWait) {
            Write-Host "Waiting for user profile to be created... ($waited s)"
            Start-Sleep -Seconds 2
            $waited += 2
          }

          $batLines = @(
            '@echo off',
            'chcp 65001 >nul',
            'echo.',
            'echo ==================== Graceful RDP Disconnect ====================',
            'echo Switching to console session (prevents screen lock)...',
            'timeout /t 2 /nobreak >nul',
            '',
            'for /f "skip=1 tokens=3" %%s in (''query user %USERNAME%'') do (',
            '    echo Current Session ID: %%s',
            '    %windir%\System32\tscon.exe %%s /dest:console',
            ')',
            '',
            'echo.',
            'echo ==================== Operation Complete ====================',
            'echo You can safely close the RDP window now.',
            'echo Remote desktop will remain UNLOCKED.',
            'echo Meeting software will continue running.',
            'echo.',
            'pause'
          )

          # 写入多个位置确保能找到
          $desktopPaths = @(
            "C:\Users\vum\Desktop",
            "C:\Users\Public\Desktop"
          )

          foreach ($desktopPath in $desktopPaths) {
            if (-not (Test-Path $desktopPath)) {
              New-Item -ItemType Directory -Path $desktopPath -Force | Out-Null
              Write-Host "Created directory: $desktopPath"
            }

            $batPath = "$desktopPath\Logout.bat"
            $batLines | Set-Content -Path $batPath -Encoding ASCII -Force
            Write-Host "Logout.bat created at: $batPath"

            try {
              $shortcutPath = "$desktopPath\Disconnect-RDP.lnk"
              $WshShell = New-Object -ComObject WScript.Shell
              $Shortcut = $WshShell.CreateShortcut($shortcutPath)
              $Shortcut.TargetPath = $batPath
              $Shortcut.WorkingDirectory = $desktopPath
              $Shortcut.Description = "Gracefully disconnect RDP without locking screen"
              $Shortcut.Save()
              Write-Host "Shortcut created at: $shortcutPath"
            } catch {
              Write-Host "Warning: Could not create shortcut at $desktopPath - $_"
            }
          }

          # 额外放到用户根目录备用
          $fallbackPath = "C:\Users\vum\Logout.bat"
          $batLines | Set-Content -Path $fallbackPath -Encoding ASCII -Force
          Write-Host "Fallback Logout.bat created at: $fallbackPath"

          # 验证文件
          Write-Host ""
          Write-Host "=== Verification ==="
          $checkPaths = @(
            "C:\Users\vum\Desktop\Logout.bat",
            "C:\Users\Public\Desktop\Logout.bat",
            "C:\Users\vum\Logout.bat"
          )
          foreach ($p in $checkPaths) {
            if (Test-Path $p) {
              Write-Host "[OK]      $p"
            } else {
              Write-Host "[MISSING] $p"
            }
          }

      - name: Maintain Connection
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "============================================"
          Write-Host "        RDP ACCESS INFORMATION"
          Write-Host "============================================"
          Write-Host "Username : vum"
          Write-Host "============================================"
          Write-Host ""
          Write-Host "Logout.bat locations:"
          Write-Host "  1. C:\Users\vum\Desktop\Logout.bat"
          Write-Host "  2. C:\Users\Public\Desktop\Logout.bat"
          Write-Host "  3. C:\Users\vum\Logout.bat"
          Write-Host ""
          Write-Host "Before closing RDP:"
          Write-Host "  Double-click [Disconnect-RDP.lnk] on desktop"
          Write-Host "  OR right-click Logout.bat -> Run as Administrator"
          Write-Host ""
          Write-Host "============================================"
          Write-Host ""

          while ($true) {
            Write-Host "[$(Get-Date)] RDP Session Active - Ctrl+C to terminate"
            Start-Sleep -Seconds 300
          }
